name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall -q .
      - run: ruff check .
      - run: pytest --cov=. --cov-report=term-missing
      - run: python scripts/run_evaluations.py
      # Build a clean release archive and fail if any forbidden file leaked in.
      - run: python scripts/build_release.py
      - name: Reject forbidden files in the repo tree
        run: |
          if git ls-files | grep -E '(^|/)(\.venv|\.claude|__pycache__|\.pytest_cache|\.ruff_cache)/|\.env$|\.db$|\.mht$'; then
            echo "Forbidden tracked files found"; exit 1
          fi
