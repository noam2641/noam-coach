[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["data", "storage", "backups", ".venv", "dist", ".claude"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --disable-warnings --maxfail=1"
