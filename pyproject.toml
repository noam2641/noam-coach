[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["data", "storage", "backups", ".venv", "dist", ".claude"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E501"]

# Pytest configuration lives in pytest.ini, which takes precedence over this
# section. Duplicating it here meant edits to one file had no effect -- the
# --maxfail=1 that hid eight of nine suite failures was present in both.
