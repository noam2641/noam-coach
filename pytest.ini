[pytest]
# Single source of truth for pytest configuration. pytest.ini takes precedence
# over [tool.pytest.ini_options] in pyproject.toml, so the settings live here
# only -- duplicating them meant a change to one file silently did nothing.
asyncio_mode = auto
testpaths = tests
# NO --maxfail here. It was previously pinned to 1, which aborted the run at
# the first failure and hid every later one: a suite with nine failures
# reported one. A plain `pytest` must show the complete picture.
addopts = -q --disable-warnings
